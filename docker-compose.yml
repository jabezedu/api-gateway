version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: apigateway_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: apigateway
    ports:
      - "5449:5432"
    volumes:
      - apigateway_pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apigateway"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apigateway_backend
    environment:
      PORT: 4009
      DATABASE_URL: postgres://postgres:postgres@db:5432/apigateway
      JWT_SECRET: supersecret_apigateway_jwt_key_2026
      CORS_ORIGIN: http://localhost:3009
    ports:
      - "4009:4009"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4009
    container_name: apigateway_frontend
    ports:
      - "3009:3009"
    depends_on:
      - backend

volumes:
  apigateway_pgdata:
